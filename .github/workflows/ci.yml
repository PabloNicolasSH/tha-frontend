name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Una ejecución nueva sobre la misma rama cancela la anterior en curso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Angular 22 exige Node 24.15 o superior: "24" resuelve a la última 24.x.
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vitest con jsdom: no hace falta navegador.
      - name: Run unit tests
        run: npm test -- --watch=false

      # Compilación de producción. Falla si se superan los presupuestos de tamaño
      # de angular.json (error a partir de 1 MB iniciales y 8 kB por componente).
      - name: Production build
        run: npm run build
