<div class="th-field" [attr.data-invalid]="error() ? true : null">
  <div class="th-password th-float">
    <!-- placeholder=" " (un espacio): lo necesita la etiqueta flotante para saber si el campo está vacío -->
    <input
      class="th-input"
      [id]="fieldId()"
      [type]="visible() ? 'text' : 'password'"
      [value]="value()"
      [disabled]="disabled()"
      [attr.autocomplete]="autocomplete()"
      [attr.aria-invalid]="error() ? true : null"
      [attr.aria-describedby]="error() || hint() ? fieldId() + '-msg' : null"
      placeholder=" "
      autocapitalize="none"
      spellcheck="false"
      (input)="onInput($event)"
      (blur)="onTouched()"
    />
    <label class="th-float__label" [for]="fieldId()">{{ label() }}</label>
    <button
      class="th-password__toggle"
      type="button"
      [attr.aria-label]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      [attr.aria-pressed]="visible()"
      (click)="toggle()"
    >
      @if (visible()) {
        <!-- ojo tachado -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10.7 5.1A10.4 10.4 0 0 1 12 5c6 0 9.5 7 9.5 7a15.9 15.9 0 0 1-2.2 3M6.6 6.6A15.7 15.7 0 0 0 2.5 12S6 19 12 19a9.7 9.7 0 0 0 5.4-1.6" />
          <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18" />
        </svg>
      } @else {
        <!-- ojo -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7Z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      }
    </button>
  </div>

  @if (error(); as message) {
    <span class="th-error" [id]="fieldId() + '-msg'">{{ message }}</span>
  } @else if (hint(); as message) {
    <span class="th-hint" [id]="fieldId() + '-msg'">{{ message }}</span>
  }
</div>
